name: Instaladores

# Genera el instalador de Windows (.exe) y la imagen de macOS (.dmg).
# - En cada PR y push a main: quedan como artefactos de la ejecución.
# - Para publicar una versión nueva (la app la ofrece sola a quien la tenga instalada):
#     Actions → Instaladores → Run workflow → escribir el número (ej. 0.3.8) → Run workflow.
#   Compila los tres instaladores y recién al final crea la etiqueta v0.3.8 y la Release con
#   todo adjunto, así la app nunca ve una versión «vacía».
# - También sigue andando crear la Release a mano en GitHub (etiqueta vX.Y.Z): los
#   instaladores se adjuntan solos unos 20 minutos después.
on:
  push:
    branches: [main]
    tags: ["v*", "V*"]   # v0.2.0 o V0.2.0
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Número de la versión a publicar, ej. 0.3.8 (vacío: solo compilar, sin publicar)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS-AppleSilicon
          - os: macos-15-intel
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Versión
        shell: bash
        env:
          VERSION_PEDIDA: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$VERSION_PEDIDA" ]]; then V="$VERSION_PEDIDA"
          elif [[ "$GITHUB_REF" == refs/tags/[vV]* ]]; then V="${GITHUB_REF#refs/tags/}"
          else V="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"; fi
          V="$(echo "$V" | tr -d '[:space:]')"; V="${V#[vV]}"; V="${V#.}"   # «v.0.3.6» → «0.3.6»
          if [[ ! "$V" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then echo "::error::Versión inválida: «$V» (tiene que ser como 0.3.8)"; exit 1; fi
          if [[ -n "$VERSION_PEDIDA" ]] && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "::error::La versión v$V ya existe. Usá un número más alto."; exit 1
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "VERSION = \"$V\"" > flightcase/_version.py   # para «Acerca de»

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Empaquetar con PyInstaller
        run: pyinstaller packaging/flightcase.spec --noconfirm --distpath dist --workpath build

      - name: Instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging\windows_installer.iss

      - name: Imagen DMG de macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R "dist/LBD Flightcase Maker.app" dmg/
          ln -s /Applications dmg/Aplicaciones
          # hdiutil a veces falla con "Resource busy" en las máquinas de GitHub: se reintenta
          for intento in 1 2 3 4 5; do
            hdiutil create -volname "LBD Flightcase Maker" -srcfolder dmg -ov -format UDZO \
              "dist/LBDFlightcaseMaker-${APP_VERSION}-${{ matrix.name }}.dmg" && break
            [ "$intento" = 5 ] && exit 1
            echo "hdiutil falló (intento $intento), reintentando..."; sleep $((intento * 5))
          done

      - uses: actions/upload-artifact@v4
        with:
          name: LBDFlightcaseMaker-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Etiqueta
        shell: bash
        env:
          VERSION_PEDIDA: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$VERSION_PEDIDA" ]]; then V="$(echo "$VERSION_PEDIDA" | tr -d '[:space:]')"; V="${V#[vV]}"; V="${V#.}"; T="v$V"
          else T="$GITHUB_REF_NAME"; fi
          echo "ETIQUETA=$T" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          # Al publicar desde «Run workflow» se crea la etiqueta vX.Y.Z en este commit
          tag_name: ${{ env.ETIQUETA }}
          target_commitish: ${{ github.sha }}
