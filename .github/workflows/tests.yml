name: Tests

# Corre los tests en cada PR y en cada push a main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Librerías del sistema para Qt y OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa libopengl0 \
            libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Tests
        run: python -m pytest -q
