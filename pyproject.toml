[project]
name = "flightcase-calculator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.5.4",
    "pyopengl>=3.1.10",
    "pyside6>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["flightcase*"]

[tool.setuptools.package-data]
flightcase = ["resources/*"]
